<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rebecca Kennedy Workout Tracker</title><style>body{font:16px system-ui;background:#f5f7fa;color:#203344;margin:0}header{background:#183a56;color:white;padding:20px}main{max-width:900px;margin:auto;padding:14px}.card{background:white;border-radius:12px;padding:14px;margin:12px 0}.tabs{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #a8b8c8;background:white;border-radius:8px;padding:11px;flex:1;font:inherit}button.on{background:#17638c;color:white}section.row{display:grid;grid-template-columns:minmax(100px,1fr) 38px 78px 78px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}input{width:100%;min-width:0;box-sizing:border-box;padding:10px 2px;font:17px system-ui;border:1px solid #aabac9;border-radius:7px;text-align:center}small{color:#687b8b}.name{font-size:13px;font-weight:600}textarea{width:100%;box-sizing:border-box;min-height:70px;font:inherit}p{line-height:1.45}@media(max-width:400px){section.row{grid-template-columns:minmax(90px,1fr) 25px 70px 70px;gap:3px}}</style><header><h2>Rebecca Kennedy — 4-Week Tracker</h2>Tap to enter weights and reps</header><main><div class="card"><div id="days" class="tabs"></div><div id="weeks" class="tabs" style="margin-top:10px"></div><p id="status"><small>Progress saves on this device.</small></p></div><div class="card"><section class="row"><b>Exercise</b><small>Sets</small><b>Lb</b><b>Reps</b></section><div id="rows"></div></div><div class="card"><b>Notes</b><textarea id="notes"></textarea></div><div class="card"><b>Back up your progress</b><p><small>Entries are stored in this browser, not on GitHub. Export backups to Files/iCloud regularly. Browser data deletion can erase local entries.</small></p><div class="tabs"><button onclick="backup()">Export backup</button><button onclick="document.getElementById('restore').click()">Restore backup</button></div><input id="restore" type="file" accept=".json" style="display:none" onchange="restore(event)"></div></main><script>const exercises=[[['3 Point Row (L&R)',3],['SS Twisting Curl',3],['Lat Pull Over',3],['Supinated Row',3],['Wide Grip Row',3],['Lateral Curl',3],['Hammer Curl',3],['Bicep Curl',3],['Double Snatch',3],['Reverse Fly',2],['Renegade Row',2],['Twisting Mnt Climber',2],['Jackknife',2],['Hollow Body',2]],[['Split Squat (L&R)',4],['Reverse Lunge (L&R)',4],['Dumbbell Squat',3],['Kickstand Deadlift (L&R)',4],['Single Leg Deadlift (L&R)',4],['RDL',3],['Single Leg Stretch/Pull',2],['Oblique Tuck Up (L&R)',2],['Butterfly Sit Up',2],['EMOM DB Swing',5],['Squat Jump',5]],[['NG Chest Press',4],['OH Press',3],['Chest Fly',3],['Skull Crusher',3],['Lateral Raise',3],['Tricep Kick Back',3],['Push Up',3]]];let d=0,w=0,data={};try{data=JSON.parse(localStorage.getItem('rk-split-v1')||'{}')}catch(e){}function save(){try{localStorage.setItem('rk-split-v1',JSON.stringify(data));document.getElementById('status').textContent='Saved on this device ✓'}catch(e){document.getElementById('status').textContent='Save failed — export backup'}}function render(){const ds=document.getElementById('days'),ws=document.getElementById('weeks');ds.replaceChildren();ws.replaceChildren();['Pull','Legs & Core','Push'].forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.className=d===i?'on':'';b.onclick=()=>{d=i;render()};ds.append(b)});for(let i=0;i<4;i++){let b=document.createElement('button');b.textContent='Week '+(i+1);b.className=w===i?'on':'';b.onclick=()=>{w=i;render()};ws.append(b)}let rows=document.getElementById('rows');rows.replaceChildren();exercises[d].forEach(([name,sets],i)=>{let r=document.createElement('section');r.className='row';let n=document.createElement('div');n.className='name';n.textContent=name;let s=document.createElement('small');s.textContent=sets;r.append(n,s);['weight','reps'].forEach(f=>{let inp=document.createElement('input');inp.inputMode='decimal';inp.setAttribute('aria-label',name+' '+f);let key=[d,w,i,f].join('-');inp.value=data[key]||'';inp.placeholder=f==='weight'&&/Twisting Mnt|Jackknife|Hollow Body|Single Leg Stretch|Oblique Tuck|Butterfly Sit|Squat Jump|Push Up/.test(name)?'N/A':'—';inp.oninput=()=>{data[key]=inp.value;save()};r.append(inp)});rows.append(r)});let notes=document.getElementById('notes');notes.value=data[d+'-'+w+'-notes']||'';notes.oninput=()=>{data[d+'-'+w+'-notes']=notes.value;save()}}function backup(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='Rebecca-Tracker-Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function restore(e){try{let obj=JSON.parse(await e.target.files[0].text());if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error();if(confirm('Replace your current progress with this backup?')){data=obj;save();render()}}catch(err){alert('Invalid backup file')}}render();</script></html>
