<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rebecca Kennedy Workout Tracker</title><style>body{font:16px system-ui;background:#f5f7fa;color:#203344;margin:0}header{background:#183a56;color:white;padding:18px}main{max-width:950px;margin:auto;padding:12px}.card{background:white;border-radius:12px;padding:13px;margin:12px 0}.tabs{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #a8b8c8;background:white;border-radius:8px;padding:10px;flex:1;font:inherit}button.on{background:#17638c;color:white}.exercise{border-top:1px solid #ccd6dd;padding:12px 0}.exercise h3{margin:0 0 7px;font-size:16px}.setrow{display:grid;grid-template-columns:35px 47px minmax(65px,1fr) minmax(65px,1fr);gap:6px;align-items:center;margin:5px 0}.setrow.head{font-size:12px;color:#526474;font-weight:700}input{width:100%;min-width:0;box-sizing:border-box;padding:9px 2px;font:16px system-ui;border:1px solid #aabac9;border-radius:7px;text-align:center}small{color:#687b8b}textarea{width:100%;box-sizing:border-box;min-height:70px;font:inherit}.totals{font-size:13px;background:#edf4f8;padding:7px;border-radius:6px;margin-top:7px}p{line-height:1.45}</style><header><h2>Rebecca Kennedy — 4-Week Tracker</h2>Track every set, side, weight and rep</header><main><div class="card"><div id="days" class="tabs"></div><div id="weeks" class="tabs" style="margin-top:10px"></div><p id="status"><small>Progress saves on this device.</small></p></div><div class="card"><div id="rows"></div></div><div class="card"><b>Notes</b><textarea id="notes"></textarea></div><div class="card"><b>Back up your progress</b><p><small>Entries are stored in this browser, not on GitHub. Export backups to Files/iCloud regularly.</small></p><div class="tabs"><button onclick="backup()">Export backup</button><button onclick="document.getElementById('restore').click()">Restore backup</button></div><input id="restore" type="file" accept=".json" style="display:none" onchange="restore(event)"></div></main><script>
const exercises=[[['3 Point Row (L&R)',3],['SS Twisting Curl',3],['Lat Pull Over',3],['Supinated Row',3],['Wide Grip Row',3],['Lateral Curl',3],['Hammer Curl',3],['Bicep Curl',3],['Double Snatch',3],['Reverse Fly',2],['Renegade Row',2],['Twisting Mnt Climber',2],['Jackknife',2],['Hollow Body',2]],[['Split Squat (L&R)',4],['Reverse Lunge (L&R)',4],['Dumbbell Squat',3],['Kickstand Deadlift (L&R)',4],['Single Leg Deadlift (L&R)',4],['RDL',3],['Single Leg Stretch/Pull',2],['Oblique Tuck Up (L&R)',2],['Butterfly Sit Up',2],['EMOM DB Swing',5],['Squat Jump',5]],[['NG Chest Press',4],['OH Press',3],['Chest Fly',3],['Skull Crusher',3],['Lateral Raise',3],['Tricep Kick Back',3],['Push Up',3]]];
let d=0,w=0,data={};try{data=JSON.parse(localStorage.getItem('rk-split-v1')||'{}')}catch(e){}
function save(){try{localStorage.setItem('rk-split-v1',JSON.stringify(data));document.getElementById('status').textContent='Saved on this device ✓'}catch(e){document.getElementById('status').textContent='Save failed — export backup'}}
function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function render(){const ds=document.getElementById('days'),ws=document.getElementById('weeks');ds.replaceChildren();ws.replaceChildren();['Pull','Legs & Core','Push'].forEach((n,i)=>{let b=el('button',d===i?'on':'',n);b.onclick=()=>{d=i;render()};ds.append(b)});for(let i=0;i<4;i++){let b=el('button',w===i?'on':'','Week '+(i+1));b.onclick=()=>{w=i;render()};ws.append(b)}
let rows=document.getElementById('rows');rows.replaceChildren();exercises[d].forEach(([name,sets],i)=>{let block=el('div','exercise'),heading=el('h3','',name);block.append(heading);let head=el('div','setrow head');['Set','Side','Weight (lb)','Reps'].forEach(t=>head.append(el('span','',t)));block.append(head);
let reps=[];for(let set=1;set<=sets;set++){for(let side of ['L','R']){let r=el('div','setrow');r.append(el('b','',String(set)),el('span','',side==='L'?'Left':'Right'));for(let field of ['weight','reps']){let input=el('input');input.inputMode='decimal';input.setAttribute('aria-label',name+' set '+set+' '+(side==='L'?'left':'right')+' '+field);let key=[d,w,i,set,side,field].join('-');input.value=data[key]??'';input.placeholder='—';input.oninput=()=>{data[key]=input.value;save();updateTotals()};r.append(input)}block.append(r)}}let total=el('div','totals');block.append(total);function updateTotals(){let left=0,right=0;for(let set=1;set<=sets;set++){left+=Number(data[[d,w,i,set,'L','reps'].join('-')])||0;right+=Number(data[[d,w,i,set,'R','reps'].join('-')])||0}total.textContent='Reps total: Left '+left+' + Right '+right+' = '+(left+right)}updateTotals();rows.append(block)});
let notes=document.getElementById('notes');notes.value=data[d+'-'+w+'-notes']||'';notes.oninput=()=>{data[d+'-'+w+'-notes']=notes.value;save()}}
function backup(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='Rebecca-Tracker-Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function restore(e){try{let obj=JSON.parse(await e.target.files[0].text());if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error();if(confirm('Replace your current progress with this backup?')){data=obj;save();render()}}catch(err){alert('Invalid backup file')}}render();
</script></html>
