<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rebecca Kennedy — Workout Tracker</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#233649;background:#f2f5f8;font-size:16px}
*{box-sizing:border-box}body{margin:0}header{background:#1d4561;color:#fff;padding:20px 15px}header h1{font-size:22px;margin:0 0 5px}header p{margin:0;font-size:13px;opacity:.9}
main{max-width:880px;margin:auto;padding:12px}.card{background:white;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #1d38521a}.tabs{display:flex;flex-wrap:wrap;gap:7px}
button{font:inherit;padding:10px 8px;border:1px solid #abc0ce;border-radius:8px;background:white;color:#19405b;min-height:43px;cursor:pointer}.tabs button{flex:1}button.active{background:#17638c;color:white;border-color:#17638c}
.work{padding:15px 0;border-top:1px solid #d6e0e9}.work:first-child{border-top:0;padding-top:2px}
.work h2{font-size:17px;margin:0 0 4px}.hint{font-size:12px;color:#647586;margin:0 0 10px}
.row{display:grid;grid-template-columns:minmax(75px,1.4fr) minmax(65px,1fr) minmax(65px,1fr);align-items:center;gap:7px;margin:6px 0}
.row.four{grid-template-columns:minmax(80px,1.3fr) minmax(60px,1fr) minmax(60px,1fr) minmax(60px,1fr)}
.row.head{font-weight:650;color:#5e7080;font-size:12px}
.row .desc{font-size:13px;font-weight:550}
input{min-width:0;width:100%;border:1px solid #b4c2ce;border-radius:7px;padding:10px 5px;font:16px system-ui;text-align:center}
textarea{display:block;width:100%;border:1px solid #b4c2ce;border-radius:7px;padding:9px;font:15px system-ui;min-height:41px;resize:vertical}
.notelabel{font-size:12px;font-weight:650;color:#62788a;margin:9px 0 3px}
.total{background:#eaf1f5;border-radius:6px;padding:7px 9px;font-size:13px;margin-top:8px}
hr{border:0;border-top:1px solid #e0e6ed}.muted{font-size:13px;color:#586c7c;line-height:1.5}.small{font-size:12px;color:#52687a}
@media(max-width:390px){.row{gap:4px}.row.four{gap:3px}.row .desc{font-size:12px}input{padding:9px 3px}}
</style></head><body>
<header><h1>Rebecca Kennedy — 4-Week Tracker</h1><p>Separate sets, movements and modifications • Saves on this device</p></header>
<main>
<div class="card"><div id="daytabs" class="tabs"></div><div id="weektabs" class="tabs" style="margin-top:8px"></div><p class="small" id="status">Changes save in this browser.</p></div>
<div class="card" id="workouts"></div>
<div class="card"><b>Back up your progress</b><p class="muted">Your entries are saved only in this browser, not synchronized across devices. Export a backup to Files or iCloud regularly.</p><div class="tabs"><button id="export">Export backup</button><button id="import">Restore backup</button></div><input id="file" type="file" accept=".json" hidden></div>
</main>
<script>
'use strict';
const split=[
[
{id:'three-point',name:'3 Point Row',sets:3,sides:true,legacy:0},
{id:'twisting-curl',name:'SS Twisting Curl',sets:3,sides:true,legacy:1},
{id:'lat-pull',name:'Lat Pull Over',sets:3,legacy:2,note:'Combined left and right'},
{id:'row-combo',name:'Reverse Grip Row + Fly Row',sets:3,combo:['Reverse Grip Row','Fly Row'],note:'Bilateral — one dumbbell in each hand; record reps of both movements separately'},
{id:'curl-circuit',name:'Curl Circuit',sets:3,combo:['Lateral Curls','Hammer Curls','Bicep Curls'],presetReps:10,note:'3 rounds • 10 of each curl per round (30 total) • 1:20 work, then 0:40 rest'},
{id:'snatch',name:'Double Snatch',sets:3,legacy:8,note:'Bilateral — both arms together'},
{id:'fly-circuit',name:'Reverse Fly → Renegade Row → Twisting Mountain Climber',sets:2,combo:['Reverse Fly','Renegade Row','Twisting Mountain Climber'],noWeight:['Renegade Row','Twisting Mountain Climber'],presetRepsMap:{'Reverse Fly':10},note:'Bodyweight for Renegade Row and Twisting Mountain Climber; record any knee modifications in notes'},
{id:'jackknife',name:'Jackknife',sets:2,time:true,note:'Bodyweight • 40 seconds per round'},
{id:'hollow',name:'Hollow Body Hold',sets:2,time:true,note:'Bodyweight • 20 seconds per round'}
],
[
{id:'split-squat',name:'Split Squat',sets:4,sides:true,legacy:0},
{id:'rev-lunge',name:'Reverse Lunge',sets:4,sides:true,legacy:1},
{id:'db-squat',name:'Dumbbell Squat',sets:3,sides:true,legacy:2},
{id:'kickstand',name:'Kickstand Deadlift',sets:4,sides:true,legacy:3},
{id:'single-deadlift',name:'Single Leg Deadlift',sets:4,sides:true,legacy:4},
{id:'rdl',name:'RDL',sets:3,sides:true,legacy:5},
{id:'single-stretch',name:'Single Leg Stretch/Pull',sets:2,sides:true,legacy:6},
{id:'oblique',name:'Oblique Tuck Up',sets:2,sides:true,legacy:7},
{id:'butterfly',name:'Butterfly Sit Up',sets:2,sides:true,legacy:8},
{id:'db-swing',name:'EMOM DB Swing',sets:5,sides:true,legacy:9},
{id:'squat-jump',name:'Squat Jump',sets:5,sides:true,legacy:10}
],
[
{id:'chest',name:'NG Chest Press',sets:4,sides:true,legacy:0},
{id:'oh-press',name:'OH Press',sets:3,sides:true,legacy:1},
{id:'chest-fly',name:'Chest Fly',sets:3,sides:true,legacy:2},
{id:'skull',name:'Skull Crusher',sets:3,sides:true,legacy:3},
{id:'lateral-raise',name:'Lateral Raise',sets:3,sides:true,legacy:4},
{id:'kickback',name:'Tricep Kick Back',sets:3,sides:true,legacy:5},
{id:'pushup',name:'Push Up',sets:3,sides:true,legacy:6}
]];
let day=0,week=0,db={};
try{db=JSON.parse(localStorage.getItem('rk-split-v1')||'{}')}catch(e){}
if(!db||typeof db!=='object'||Array.isArray(db))db={};
const $=id=>document.getElementById(id);
function key(ex,set,side,movement,field){return ['v2',day,week,ex.id,set,side,movement,field].join('|')}
function legacyKey(ex,set,side,field){return [day,week,ex.legacy,set,side,field].join('-')}
function persist(){try{localStorage.setItem('rk-split-v1',JSON.stringify(db));$('status').textContent='Saved on this device ✓'}catch(e){$('status').textContent='Save unsuccessful; please export a backup'}}
function node(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function draw(){for(let [id,labels,value,callback] of [['daytabs',['Pull','Legs & Core','Push'],day,x=>day=x],['weektabs',['Week 1','Week 2','Week 3','Week 4'],week,x=>week=x]]){const box=$(id);box.replaceChildren();labels.forEach((label,i)=>{const b=node('button',i===value?'active':'',label);b.onclick=()=>{callback(i);draw()};box.append(b)})}const root=$('workouts');root.replaceChildren();split[day].forEach(ex=>renderExercise(root,ex))}
function renderExercise(root,ex){const block=node('section','work');block.append(node('h2','',ex.name));if(ex.note)block.append(node('p','hint',ex.note));let fields=[];
function makeInput(set,side,movement,field,preset){const k=key(ex,set,side,movement,field),inp=node('input');inp.inputMode='decimal';inp.setAttribute('aria-label',ex.name+' set '+set+' '+side+' '+movement+' '+field);
const old=ex.legacy!==undefined&&!ex.combo&&!ex.time?db[legacyKey(ex,set,side,field)]:undefined;
inp.value=db[k]??old??preset??'';inp.placeholder='—';inp.oninput=()=>{db[k]=inp.value;persist();recalc()};inp.onchange=()=>{if(inp.value==='')return;let sourceVal=inp.value;for(const other of fields){if(other.set<=set||other.side!==side||other.movement!==movement||other.field!==field||other.input.value!=='')continue;other.input.value=sourceVal;db[other.key]=sourceVal}persist();recalc()};fields.push({set,side,movement,field,input:inp,key:k});return inp}
function addRow(set,side,movement,weightAllowed=true,presetReps=''){const combo=!!ex.combo;const r=node('div','row'+(combo?' four':''));let title=combo?'Round '+set:ex.sides?'Set '+set:'Set '+set;if(ex.sides)title+=' '+(side==='L'?'Left':'Right');r.append(node('span','desc',title));if(combo)r.append(node('span','desc',movement));if(weightAllowed)r.append(makeInput(set,side,movement,'weight'));else r.append(node('span','small','Bodyweight'));r.append(makeInput(set,side,movement,'reps',presetReps));block.append(r)}
const head=node('div','row head'+(ex.combo?' four':''));
(ex.combo?['Round','Movement','Weight (lb)','Reps']:['Set / side','Weight (lb)','Reps']).forEach(s=>head.append(node('span','',s)));if(!ex.time)block.append(head);
if(ex.time){for(let set=1;set<=ex.sets;set++){const r=node('div','row');r.append(node('span','desc','Round '+set),node('span','small','Bodyweight • timed'));r.append(makeInput(set,'both',ex.id,'seconds',ex.id==='jackknife'?40:20));block.append(r)}}
else for(let set=1;set<=ex.sets;set++){const sides=ex.sides?['L','R']:['both'];for(const side of sides){const movements=ex.combo?ex.combo:[ex.id];for(const movement of movements){const weightAllowed=!(ex.noWeight||[]).includes(movement)&&!['Twisting Mnt Climber','Squat Jump','Push Up'].includes(ex.name);let preset=ex.presetRepsMap?.[movement]??ex.presetReps??'';addRow(set,side,movement,weightAllowed,preset)}}}
const totals=node('div','total');block.append(totals);function recalc(){if(ex.time){totals.textContent='Timed bodyweight exercise';return}let total=0,left=0,right=0;for(const f of fields){if(f.field!=='reps')continue;let n=Number(f.input.value)||0;total+=n;if(f.side==='L')left+=n;if(f.side==='R')right+=n}totals.textContent=ex.sides?'Total reps: Left '+left+' + Right '+right+' = '+total:'Total reps across rounds: '+total}
recalc();block.append(node('div','notelabel','Notes / modifications'));const note=node('textarea');note.rows=1;note.placeholder='e.g. on knees, lighter weight, form adjustments';const nk=key(ex,0,'','', 'notes');note.value=db[nk]??'';note.oninput=()=>{db[nk]=note.value;persist()};block.append(note);root.append(block)}
$('export').onclick=()=>{const a=node('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='Rebecca-Tracker-Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const file=e.target.files?.[0];if(!file)return;const v=JSON.parse(await file.text());if(!v||Array.isArray(v)||typeof v!=='object')throw Error();if(confirm('Replace current saved progress with this backup?')){db=v;persist();draw()}}catch(e){alert('That backup file was not valid.')}e.target.value=''};draw();
</script></body></html>
